<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учим немецкие слова - A1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab:hover {
            transform: translateY(-2px);
        }

        .content {
            min-height: 400px;
        }

        .card-container {
            perspective: 1000px;
            margin: 20px 0;
        }

        .card {
            width: 100%;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .german-word {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .article {
            font-size: 24px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .russian-word {
            font-size: 28px;
            margin-top: 10px;
        }

        .card-hint {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .quiz-option {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            text-align: left;
        }

        .quiz-option:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .quiz-option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .quiz-option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .quiz-question {
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .hidden {
            display: none;
        }

        .reset-btn {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇩🇪 Учим немецкие слова</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Уровень A1</p>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="learned-count">0</div>
                <div class="stat-label">Выучено</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-count">30</div>
                <div class="stat-label">Всего слов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="mistakes-count">0</div>
                <div class="stat-label">Ошибок</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('cards')">Карточки</button>
            <button class="tab" onclick="switchTab('quiz')">Тест</button>
        </div>

        <div class="content">
            <!-- Режим карточек -->
            <div id="cards-mode">
                <div class="card-container">
                    <div class="card" id="flashcard" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="article" id="card-article"></div>
                            <div class="german-word" id="card-german"></div>
                            <div class="card-hint">Нажмите, чтобы перевернуть</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="russian-word" id="card-russian"></div>
                            <div class="card-hint">Нажмите, чтобы вернуться</div>
                        </div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="card-progress"></div>
                </div>

                <div class="controls">
                    <button class="btn btn-secondary" onclick="previousCard()">← Назад</button>
                    <button class="btn btn-success" onclick="markLearned()">✓ Выучено</button>
                    <button class="btn btn-primary" onclick="nextCard()">Далее →</button>
                </div>

                <div style="text-align: center; margin-top: 15px; color: #666;">
                    <span id="card-counter">1 / 30</span>
                </div>
            </div>

            <!-- Режим теста -->
            <div id="quiz-mode" class="hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="quiz-progress"></div>
                </div>

                <div class="quiz-question" id="quiz-question"></div>

                <div id="quiz-options"></div>

                <div class="controls" style="margin-top: 30px;">
                    <button class="btn btn-primary" id="quiz-next-btn" onclick="nextQuizQuestion()" style="display: none;">
                        Следующий вопрос →
                    </button>
                </div>

                <div style="text-align: center; margin-top: 15px; color: #666;">
                    <span id="quiz-counter"></span>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetProgress()">Сбросить прогресс</button>
    </div>

    <script>
        // База слов A1 уровня
        const words = [
            { german: "der Hund", article: "der", russian: "собака" },
            { german: "die Katze", article: "die", russian: "кошка" },
            { german: "das Haus", article: "das", russian: "дом" },
            { german: "das Auto", article: "das", russian: "автомобиль" },
            { german: "die Schule", article: "die", russian: "школа" },
            { german: "der Tisch", article: "der", russian: "стол" },
            { german: "der Stuhl", article: "der", russian: "стул" },
            { german: "das Buch", article: "das", russian: "книга" },
            { german: "die Lampe", article: "die", russian: "лампа" },
            { german: "der Computer", article: "der", russian: "компьютер" },
            { german: "das Telefon", article: "das", russian: "телефон" },
            { german: "die Tür", article: "die", russian: "дверь" },
            { german: "das Fenster", article: "das", russian: "окно" },
            { german: "der Baum", article: "der", russian: "дерево" },
            { german: "die Blume", article: "die", russian: "цветок" },
            { german: "das Wasser", article: "das", russian: "вода" },
            { german: "das Brot", article: "das", russian: "хлеб" },
            { german: "die Milch", article: "die", russian: "молоко" },
            { german: "der Kaffee", article: "der", russian: "кофе" },
            { german: "der Tee", article: "der", russian: "чай" },
            { german: "das Kind", article: "das", russian: "ребёнок" },
            { german: "der Mann", article: "der", russian: "мужчина" },
            { german: "die Frau", article: "die", russian: "женщина" },
            { german: "der Freund", article: "der", russian: "друг" },
            { german: "die Freundin", article: "die", russian: "подруга" },
            { german: "die Familie", article: "die", russian: "семья" },
            { german: "der Tag", article: "der", russian: "день" },
            { german: "die Nacht", article: "die", russian: "ночь" },
            { german: "das Jahr", article: "das", russian: "год" },
            { german: "die Zeit", article: "die", russian: "время" }
        ];

        // Состояние приложения
        let state = {
            currentCardIndex: 0,
            learnedWords: [],
            mistakes: [],
            quizQuestions: [],
            currentQuizIndex: 0,
            quizAnswered: false
        };

        // Загрузка прогресса из localStorage
        function loadProgress() {
            const saved = localStorage.getItem('germanWordsProgress');
            if (saved) {
                const data = JSON.parse(saved);
                state.learnedWords = data.learnedWords || [];
                state.mistakes = data.mistakes || [];
            }
            updateStats();
        }

        // Сохранение прогресса в localStorage
        function saveProgress() {
            localStorage.setItem('germanWordsProgress', JSON.stringify({
                learnedWords: state.learnedWords,
                mistakes: state.mistakes
            }));
            updateStats();
        }

        // Обновление статистики
        function updateStats() {
            document.getElementById('learned-count').textContent = state.learnedWords.length;
            document.getElementById('mistakes-count').textContent = state.mistakes.length;
        }

        // Переключение вкладок
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'cards') {
                document.getElementById('cards-mode').classList.remove('hidden');
                document.getElementById('quiz-mode').classList.add('hidden');
                showCard();
            } else {
                document.getElementById('cards-mode').classList.add('hidden');
                document.getElementById('quiz-mode').classList.remove('hidden');
                startQuiz();
            }
        }

        // Показ карточки
        function showCard() {
            const card = words[state.currentCardIndex];
            document.getElementById('card-article').textContent = card.article;
            document.getElementById('card-german').textContent = card.german.replace(card.article + ' ', '');
            document.getElementById('card-russian').textContent = card.russian;
            document.getElementById('card-counter').textContent = `${state.currentCardIndex + 1} / ${words.length}`;
            
            const progress = ((state.currentCardIndex + 1) / words.length) * 100;
            document.getElementById('card-progress').style.width = progress + '%';

            // Сброс переворота
            document.getElementById('flashcard').classList.remove('flipped');
        }

        // Переворот карточки
        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        // Следующая карточка
        function nextCard() {
            state.currentCardIndex = (state.currentCardIndex + 1) % words.length;
            showCard();
        }

        // Предыдущая карточка
        function previousCard() {
            state.currentCardIndex = (state.currentCardIndex - 1 + words.length) % words.length;
            showCard();
        }

        // Отметить как выученное
        function markLearned() {
            const word = words[state.currentCardIndex];
            if (!state.learnedWords.includes(word.german)) {
                state.learnedWords.push(word.german);
                saveProgress();
                
                // Визуальная обратная связь
                const btn = event.target;
                btn.textContent = '✓ Выучено!';
                btn.style.background = '#28a745';
                setTimeout(() => {
                    btn.textContent = '✓ Выучено';
                    nextCard();
                }, 500);
            } else {
                nextCard();
            }
        }

        // Начало теста
        function startQuiz() {
            // Создаём вопросы из всех слов
            state.quizQuestions = [...words].sort(() => Math.random() - 0.5);
            state.currentQuizIndex = 0;
            showQuizQuestion();
        }

        // Показ вопроса теста
        function showQuizQuestion() {
            if (state.currentQuizIndex >= state.quizQuestions.length) {
                showQuizResults();
                return;
            }

            state.quizAnswered = false;
            const currentWord = state.quizQuestions[state.currentQuizIndex];
            
            document.getElementById('quiz-question').textContent = 
                `Как переводится "${currentWord.german}"?`;

            // Генерация вариантов ответов
            const options = [currentWord.russian];
            while (options.length < 4) {
                const randomWord = words[Math.floor(Math.random() * words.length)].russian;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            options.sort(() => Math.random() - 0.5);

            // Отображение вариантов
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, currentWord.russian, btn);
                optionsContainer.appendChild(btn);
            });

            // Прогресс
            const progress = ((state.currentQuizIndex) / state.quizQuestions.length) * 100;
            document.getElementById('quiz-progress').style.width = progress + '%';
            document.getElementById('quiz-counter').textContent = 
                `Вопрос ${state.currentQuizIndex + 1} из ${state.quizQuestions.length}`;
            
            document.getElementById('quiz-next-btn').style.display = 'none';
        }

        // Проверка ответа
        function checkAnswer(selected, correct, btn) {
            if (state.quizAnswered) return;
            state.quizAnswered = true;

            const currentWord = state.quizQuestions[state.currentQuizIndex];
            
            if (selected === correct) {
                btn.classList.add('correct');
                // Убираем из ошибок если было
                state.mistakes = state.mistakes.filter(w => w !== currentWord.german);
            } else {
                btn.classList.add('incorrect');
                // Подсвечиваем правильный ответ
                document.querySelectorAll('.quiz-option').forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.classList.add('correct');
                    }
                });
                // Добавляем в ошибки
                if (!state.mistakes.includes(currentWord.german)) {
                    state.mistakes.push(currentWord.german);
                }
            }

            saveProgress();
            document.getElementById('quiz-next-btn').style.display = 'block';
        }

        // Следующий вопрос теста
        function nextQuizQuestion() {
            state.currentQuizIndex++;
            showQuizQuestion();
        }

        // Показ результатов теста
        function showQuizResults() {
            const correctCount = state.quizQuestions.length - state.mistakes.length;
            document.getElementById('quiz-question').textContent = 'Тест завершён!';
            document.getElementById('quiz-options').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <p style="font-size: 18px; margin-bottom: 15px;">
                        Правильных ответов: ${state.quizQuestions.length - state.mistakes.length} из ${state.quizQuestions.length}
                    </p>
                    <p style="color: #666; margin-bottom: 20px;">
                        Осталось повторить: ${state.mistakes.length} слов
                    </p>
                    ${state.mistakes.length > 0 ? 
                        `<button class="btn btn-primary" onclick="repeatMistakes()" style="margin-bottom: 10px;">
                            Повторить ошибки
                        </button>` : 
                        `<p style="color: #28a745; font-weight: bold;">Отличная работа! 🎉</p>`
                    }
                    <button class="btn btn-secondary" onclick="startQuiz()" style="margin-top: 10px;">
                        Пройти тест заново
                    </button>
                </div>
            `;
            document.getElementById('quiz-next-btn').style.display = 'none';
            document.getElementById('quiz-progress').style.width = '100%';
        }

        // Повторение ошибок
        function repeatMistakes() {
            if (state.mistakes.length === 0) {
                alert('Нет ошибок для повторения!');
                return;
            }
            
            state.quizQuestions = words.filter(w => state.mistakes.includes(w.german));
            state.currentQuizIndex = 0;
            showQuizQuestion();
        }

        // Сброс прогресса
        function resetProgress() {
            if (confirm('Вы уверены, что хотите сбросить весь прогресс?')) {
                localStorage.removeItem('germanWordsProgress');
                state.learnedWords = [];
                state.mistakes = [];
                updateStats();
                showCard();
            }
        }

        // Инициализация
        loadProgress();
        showCard();
    </script>
</body>
</html>
